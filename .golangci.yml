# This configuration file is not a recommendation.
#
# We intentionally use a limited set of linters.
# This configuration file is used with different version of golangci-lint to avoid regressions:
# the linters can change between version,
# their configuration may be not compatible or their reports can be different,
# and this can break some of our tests.
# Also, some linters are not relevant for the project (e.g. linters related to SQL).
#
# We have specific constraints, so we use a specific configuration.
#
# See the file `.golangci.reference.yml` to have a list of all available configuration options.
#
# Migrated to the golangci-lint v2 format (`golangci-lint migrate`); see
# https://golangci-lint.run/docs/product/migration-guide/.

version: "2"

run:
  # golangci-lint v2 disables the run timeout by default; keep the explicit
  # five-minute limit this project used with v1.
  timeout: 5m

linters:
  default: none
  # This list of linters is not a recommendation (same thing for all this configuration file).
  # We intentionally use a limited set of linters.
  # See the comment on top of this file.
  #
  # v2 changes from the v1 list:
  # - gosimple and stylecheck are merged into staticcheck (enabled below).
  # - gofmt and goimports are formatters (see `formatters`).
  # - exportloopref was removed from golangci-lint v2; with Go 1.22 loop
  #   variable semantics (see go.mod) the bug class it reported no longer exists.
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - whitespace

  settings:
    depguard:
      rules:
        logger:
          files:
            # logrus is allowed to use only in logutils package.
            - "!**/pkg/logutils/**.go"
          deny:
            # logging is allowed only by logutils.Log,
            - pkg: "github.com/sirupsen/logrus"
              desc: logging is allowed only by logutils.Log.
            - pkg: "github.com/pkg/errors"
              desc: Should be replaced by standard lib errors package.
            - pkg: "github.com/instana/testify"
              desc: It's a fork of github.com/stretchr/testify.
    dupl:
      threshold: 100
    errorlint:
      asserts: false
    funlen:
      lines: -1 # the number of lines (code + empty lines) is not a right metric and leads to code without empty line or one-liner.
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - ifElseChain
        - octalLiteral
        - whyNoLint
    gocyclo:
      min-complexity: 15
    godox:
      keywords:
        - FIXME
    govet:
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
      enable:
        - nilness
        - shadow
    lll:
      line-length: 140
    misspell:
      locale: US
      ignore-rules:
        - "importas" # linter name
    mnd:
      # don't include the "operation" and "assign"
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
      ignored-functions:
        - strings.SplitN
    nolintlint:
      allow-unused: false # report any unused nolint directives
      require-explanation: true # require an explanation for nolint directives
      require-specific: true # require nolint directives to be specific about which linter is being skipped
    revive:
      rules:
        - name: indent-error-flow
        - name: unexported-return
          disabled: true
        - name: unused-parameter
        - name: unused-receiver

  exclusions:
    # `generated: lax` and these presets reproduce the v1 defaults
    # (`exclude-generated: lax`, `exclude-use-default: true`) that the v1
    # configuration relied on implicitly.
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)_test\.go
        linters:
          - dupl
          - mnd
          - lll

      # The logic of creating a linter is similar between linters, it's not duplication.
      - path: pkg/golinters
        linters:
          - dupl

      # Deprecated configuration options.
      - path: pkg/commands/run.go
        linters: [staticcheck]
        text: "SA1019: c.cfg.Run.ShowStats is deprecated: use Output.ShowStats instead."

      # Deprecated linter options.
      - path: pkg/golinters/errcheck/errcheck.go
        linters: [staticcheck]
        text: "SA1019: errCfg.Exclude is deprecated: use ExcludeFunctions instead"
      - path: pkg/golinters/errcheck/errcheck.go
        linters: [staticcheck]
        text: "SA1019: errCfg.Ignore is deprecated: use ExcludeFunctions instead"
      - path: pkg/golinters/govet/govet.go
        linters: [staticcheck]
        text: "SA1019: cfg.CheckShadowing is deprecated: the linter should be enabled inside Enable."
      - path: pkg/golinters/godot/godot.go
        linters: [staticcheck]
        text: "SA1019: settings.CheckAll is deprecated: use Scope instead"
      - path: pkg/golinters/gci/gci.go
        linters: [staticcheck]
        text: "SA1019: settings.LocalPrefixes is deprecated: use Sections instead."
      - path: pkg/golinters/mnd/mnd.go
        linters: [staticcheck]
        text: "SA1019: settings.Settings is deprecated: use root level settings instead."
      - path: pkg/golinters/mnd/mnd.go
        linters: [staticcheck]
        text: "SA1019: config.GoMndSettings is deprecated: use MndSettings."

      # Related to `run.go`, it cannot be removed.
      - path: pkg/golinters/gofumpt/gofumpt.go
        linters: [staticcheck]
        text: "SA1019: settings.LangVersion is deprecated: use the global `run.go` instead."
      - path: pkg/golinters/internal/staticcheck_common.go
        linters: [staticcheck]
        text: "SA1019: settings.GoVersion is deprecated: use the global `run.go` instead."
      - path: pkg/lint/lintersdb/manager.go
        linters: [staticcheck]
        text: "SA1019: (.+).(GoVersion|LangVersion) is deprecated: use the global `run.go` instead."

      # Based on existing code, the modifications should be limited to make maintenance easier.
      - path: pkg/golinters/unused/unused.go
        linters: [gocritic]
        text: "rangeValCopy: each iteration copies 160 bytes \\(consider pointers or indexing\\)"

    paths:
      - test/testdata_etc # test files
      - internal/cache # extracted from Go code
      - internal/renameio # extracted from Go code
      - internal/robustio # extracted from Go code
      # v1 default excluded directories (`exclude-dirs-use-default`).
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
    goimports:
      local-prefixes:
        - github.com/golangci/golangci-lint
  exclusions:
    generated: lax
    paths:
      - test/testdata_etc # test files
      - internal/cache # extracted from Go code
      - internal/renameio # extracted from Go code
      - internal/robustio # extracted from Go code
      # v1 default excluded directories (`exclude-dirs-use-default`).
      - third_party$
      - builtin$
      - examples$
