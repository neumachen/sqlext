---
name: Code Testing

on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: Job timeout configuration in minutes
        type: number
        default: 30

jobs:
  testing:
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Set before setup-go: go-version-file then reads the go directive, not a
    # toolchain directive, and go never switches to another toolchain.
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        # Each row sets go-version or go-version-file, never both.
        include:
          - label: Go module minimum (go.mod)
            go-version-file: go.mod
          - label: Go 1.25
            go-version: "1.25"
          - label: Go 1.26
            go-version: "1.26"
          - label: Go 1.27
            go-version: "1.27"
    steps:
      - uses: actions/checkout@v6

      # setup-go ignores an empty go-version and reads go-version-file.
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          cache: false

      # The integration tests are only compiled with their build tags; vet
      # them here so they keep building without a database.
      - name: vet
        run: |
          go vet ./...
          go vet -tags integration ./...
          go vet -tags "integration pgfixtures" ./...

      # Database-free: no test opens a database without -tags integration.
      - name: test
        run: go test -race -count=1 ./...

  integration:
    name: integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      # Starts a disposable postgres:16-alpine container (pinned by digest) on
      # a loopback port and exports SQLEXT_TEST_POSTGRES_* to later steps.
      - name: start disposable PostgreSQL
        run: .dev/test-postgres.sh up

      # Missing or wrong configuration fails these tests instead of skipping
      # them; the count check makes sure the PostgreSQL tests actually ran.
      - name: integration tests
        shell: bash
        run: |
          go test -tags integration -race -count=1 -v ./... | tee "$RUNNER_TEMP/integration.log"
          passed=$(grep -c -E '^--- PASS: TestPostgres' "$RUNNER_TEMP/integration.log" || true)
          echo "PostgreSQL integration tests passed: $passed"
          test "$passed" -ge 5

      - name: stop disposable PostgreSQL
        if: always()
        run: |
          if [ -n "${SQLEXT_TEST_POSTGRES_STATE:-}" ]; then
            .dev/test-postgres.sh down "$SQLEXT_TEST_POSTGRES_STATE"
          fi
