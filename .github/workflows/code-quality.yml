name: Code Quality

on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: Job timeout configuration in minutes
        type: number
        default: 30

jobs:
  linting:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v6

      # go.mod requires Go >= 1.22; 1.26 is the Go release golangci-lint
      # v2.12.2 is built with.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      # golangci-lint-action v7+ is required for golangci-lint v2 (and the
      # version "2" .golangci.yml); v3 only installs golangci-lint v1.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
